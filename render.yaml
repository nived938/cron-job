services:
  - type: web
    name: cronflow-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REQUEST_TIMEOUT_MS
        value: "30000"
      - key: NODE_ENV
        value: production
